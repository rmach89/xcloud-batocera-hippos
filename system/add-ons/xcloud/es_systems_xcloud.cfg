<?xml version="1.0" encoding="UTF-8"?>
<!-- Xbox Cloud Gaming: the app's entry, plus each game when Settings > Batocera game list is on. -->
<systemList>
  <system>
    <name>xcloud</name>
    <fullname>Xbox Cloud Gaming</fullname>
    <manufacturer>Microsoft</manufacturer>
    <release>2020</release>
    <hardware>console</hardware>
    <path>/userdata/roms/xcloud</path>
    <extension>.xcloud</extension>
    <command>bash /userdata/system/add-ons/xcloud/Launch-XboxCloudGaming.sh --from-es %ROM%</command>
    <platform>xcloud</platform>
    <theme>xcloud</theme>
  </system>
</systemList>
