name: Idea or request
description: Something you'd like the app to do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What should it do, and when would you use it?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Your system and device (optional)
      placeholder: "Batocera v42 on a Steam Deck"
